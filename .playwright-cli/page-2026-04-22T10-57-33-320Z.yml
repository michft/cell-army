                - heading "Breakout session" [level=4] [ref=e639]
                - generic [ref=e643]:
                  - text: Every month, Service Stream's field operations generate over 1 million images requiring verification — proof that infrastructure maintenance work has been completed to contract specification. Manually reviewing this volume was resource-intensive, error-prone, and created payment bottlenecks that slowed contractor payment cycles and strained client relationships. To solve this, Service Stream partnered with AWS to build an AI-powered work order verification system. The system now processes up to 800 work orders per hour — 27 times faster than manual review — with improved accuracy, reduced subjectivity, and no increase in headcount. In this session, learn how Service Stream used AWS AI and cloud services to automatically check field images against contract requirements — delivering a production-ready solution in just three months. We'll walk through the business drivers, solution design, and real-world outcomes — including how eliminating manual bottlenecks improved ServiceS tream's ability to meet client commitments, reduce payment delays, and build trust across their contractor network. Whether you're in field services, utilities, infrastructure, or any operations-heavy industry, this session will show you how intelligent automation can transform high-volume verification workflows and deliver tangible business value.
                  - list [ref=e644]:
                    - listitem [ref=e645]: Najeeb Aftab, Account Executive, AWS
                    - listitem [ref=e646]: Shehan Arangala, Head of Data & Analytics, Service Stream
