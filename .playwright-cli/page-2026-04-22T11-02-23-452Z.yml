      - 'heading "Beyond API Dependency: Fine-tuning Cost-Effective Models on AWS" [level=3] [ref=e1551]'
      - paragraph [ref=e1552]: Breakout session
      - paragraph [ref=e1553]: As API costs for general-purpose LLMs rise, relying solely on off-the-shelf models can quickly undermine both cost control and system reliability. In this session, we share how Nearmap moved beyond API dependency by fine-tuning and distilling domain-specific models on AWS to analyze 300 million building permits for roof modifications. We’ll discuss our approach to generating and structuring training data, distilling large models into smaller, production-ready alternatives, evaluating trade-offs across model architectures, and making data-driven accuracy-versus-cost decisions before deployment. Attendees will leave with concrete patterns for shipping efficient, specialized models into production. - Iman Abbasnejad, Applied Scientist, AWS
