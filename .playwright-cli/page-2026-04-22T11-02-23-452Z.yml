      - paragraph [ref=e705]: "Automation has long relied on orchestration: predefined workflows, rigid control flows, and human-managed exceptions. That model breaks down as systems become adaptive, distributed, and autonomous. In this session, we explore the shift from orchestration to intent-based supervision, where humans define purpose, constraints, and authority, while agents decide how to act within those bounds. Drawing on real-world agentic architectures, the talk shows how dynamic discovery, semantic negotiation, and closed-loop feedback replace static workflows. Attendees will learn how to design automation that scales safely, remains governable, and adapts as context changes, without removing human judgment from the system. - Aaron Sempf, Next-Gen Tech Lead, AWS"
