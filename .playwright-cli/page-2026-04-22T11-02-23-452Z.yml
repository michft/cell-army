      - heading "How Transurban Transformed Customer Experience with AI Agents on AWS" [level=3] [ref=e2070]
      - paragraph [ref=e2071]: Breakout session
      - paragraph [ref=e2072]: "As Australia's leading toll road operator, Transurban manages millions of daily customer interactions across tolling accounts, trip queries, and payment issues. Scaling mobile app support without sacrificing quality demanded a fundamentally different approach — one powered by AI. Transurban partnered with AWS to deploy AI agents directly to customers, moving straight to production. AWS's executive engagement, architectural guidance, and security framework gave Transurban the confidence to act decisively. Amazon Bedrock's model optionality differentiated AWS from competing providers and aligned with Transurban's future-proof AI strategy. The results: a 60% reduction in chats requiring human intervention, a 15% reduction in human agent headcount, and a 27% uplift in chat adoption through the Transurban App. This session explores how a complex, customer-facing AI deployment was achieved at scale — and what transportation leaders can learn about production-ready agentic AI with AWS."
