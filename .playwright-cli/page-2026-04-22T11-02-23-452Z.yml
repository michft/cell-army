      - paragraph [ref=e773]: Dev chat
      - paragraph [ref=e774]: Moving an AI agent from prototype to production requires more than optimism. This session tackles the "Day 2" engineering challenges of scaling resilient agentic architectures on AWS. Learn practical patterns for handling traffic spikes, optimizing throughput, and controlling costs using Amazon Bedrock models and AgentCore Runtime. We'll cover tool filtering strategies, when multi-agent architectures make sense, how to apply evaluations effectively, and how to harden your APIs against real-world load. Leave with concrete techniques to transform brittle GenAI prototypes into production-grade systems that survive viral launches and demanding enterprise workloads. - Geethika Guruge, Principal Consultant, Mantel Group
