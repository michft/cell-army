      - 'heading "Decisions Over Diagrams: How Bell Financial Group Architects on AWS" [level=3] [ref=e651]'
      - paragraph [ref=e652]: Dev chat
      - paragraph [ref=e653]: "Architecture diagrams show what you built. They don't explain why. At Bell Financial Group, every major technology choice — from landing zone design to compute platform to database engine — is captured in an Architecture Decision Document that forces honest evaluation of trade-offs. In this talk, the Head of Engineering at Bell Financial Group walks through the real decisions behind their AWS platform: why ECS Fargate beat EKS, when DynamoDB wins over relational databases, why the entire infrastructure is written in TypeScript CDK, and the deliberate constraints they place on Lambda usage. No slides full of boxes and arrows — just the reasoning, the trade-offs, and the lessons learned building a regulated financial services platform on AWS. - Trent Hornibrook, Head of Engineering, Bell Financial Group"
