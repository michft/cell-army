      - paragraph [ref=e305]: Lightning talk
      - paragraph [ref=e306]: "Experience the ultimate AI showdown from your theater seat as finalists from the AWS AI League: Agentic AI challenge battle head-to-head in real-time. Watch top performers compete in a live, tournament-style competition where their AI agents navigate complex challenges, demonstrating the power of intelligent automation and decision-making under pressure. This electrifying viewing experience offers AI practitioners and enthusiasts unique insights into orchestrating intelligent agents using Amazon Bedrock AgentCore. See firsthand how agents handle real-world scenarios including code execution, web browsing, content moderation, and multi-step problem solving—all while competing for championship glory. The 1st place winner will represent Australia at the 2026 AWS AI League Championship at re:Invent 2026."
