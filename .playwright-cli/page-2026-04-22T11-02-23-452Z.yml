      - paragraph [ref=e615]: Breakout session
      - paragraph [ref=e616]: CBA is achieving operational excellence by harnessing the power of the AWS DevOps Agent, part of AWS's new Frontier Agents. In this session, discover how CBA is using AI-driven automation to streamline incident response, reduce operational friction, and strengthen resilience across critical systems. We'll discuss CBA's cloud transformation journey and operational challenges, explore the DevOps Agent implementation including architecture, integration, and user journeys, and share results and business impact with real-world metrics. You'll see how automated remediation, and proactive insights are helping teams move faster with greater confidence. Join us to discover how CBA is shaping a future where operations are smarter, safer, and built for scale. - Rovan Omar, Principal Technologist, AWS - Jason Sandery, General Manager of Cloud Services, Commonwealth Bank of Australia
