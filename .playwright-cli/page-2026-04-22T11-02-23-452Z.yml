      - paragraph [ref=e238]: Breakout session
      - paragraph [ref=e239]: "AI agents offer powerful capabilities — and introduce fundamentally new risks that require more than traditional controls. This session explores responsible agentic AI through three lenses: the science, the framework, and a real-world customer story. Understand the scientific frontiers that make agents different — from emergent behaviour and agent-to-agent trust to the challenges of governing systems that plan, negotiate, and act autonomously. Learn the four areas of the AWS Responsible AI framework where agents change the rules, and hear how one of Australia's leading health insurer is putting responsible AI into practice — from strategy to governance to real-world trade-offs. - Linta Thayyil Mathew, Principal Solutions Architect, AWS - Emma Blanusa, Group Head Data & AI, NIB"
