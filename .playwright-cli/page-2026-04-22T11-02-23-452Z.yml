      - 'heading "The AI-Driven Development Lifecycle: How Skyjed Shipped in 48 hours" [level=3] [ref=e2438]'
      - paragraph [ref=e2439]: Breakout session
      - paragraph [ref=e2440]: Traditional AI-assisted development treats AI as a tool. The AI-Driven Development Lifecycle (AI-DLC) treats it as a central collaborator throughout the development process. In this session, join Skyjed CTO Stephen Brown, to share how his team applied AI-DLC to compress a 4-6 week implementation into 48 hours. Discover how AI-DLC's three phases — Inception, Construction, and Operations — reimagines the software lifecycle through AI-powered execution with human oversight and dynamic team collaboration. Drawing on Skyjed's firsthand experience on integrating AI-assisted development into their existing software development lifecycle, this talk explores how team collaboration, Kiro-powered workflows, and enterprise-grade code development practices were enhanced rather than replaced. You'll walk away with practical steps to achieve 15–20x acceleration—without sacrificing quality, governance, or control. - Teddy Aryono, Sr. Specialist Solutions Architect, AWS - Kenny Han, Solution Architect, AWS - Stephen Brown, Co-Founder & CTO, Skyjed
