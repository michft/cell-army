      - paragraph [ref=e1481]: Financial services organizations struggle to maintain robust governance and compliance controls while scaling cloud adoption. Allianz Australia solved this challenge by building a Cloud Control Library (CCL)—an automated compliance framework that enables innovation within APRA regulatory boundaries. In this session, learn the architecture and design principles behind CCL, how it integrates automated compliance checking with AWS services, and the impact on risk posture and regulatory demonstrations. Discover how Allianz transformed from manual compliance reviews to continuous automated validation, reducing approval cycles from weeks to hours while maintaining audit-grade evidence. Gain practical patterns for building compliance-as-code frameworks that scale across hundreds of applications and distributed teams. - Melwin Pais, Senior Solutions Architect, AWS - Kriss Milne, SA, AWS - Cam Maxwell, Principal Solutions Architect, AWS
