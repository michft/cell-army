      - paragraph [ref=e1885]: Lightning talk
      - paragraph [ref=e1886]: What if your engineering team could deliver a production-ready feature in two days that would traditionally take one month? When Xero partnered with AWS, that's exactly what happened. In this session, we'll take you inside a real-world AI-Driven Development Life Cycle (AIDLC) workshop run against a live production use case. Working across an existing brownfield codebase, the Xero engineering team reached MVP in just two days against a feature that would have taken a month using traditional development methodology. We'll unpack what made that possible, what we learned along the way, and how those lessons are now shaping a plan to scale the AIDLC methodology across the entire engineering organisation. - Peter Channon, Engineering Team Lead, Xero
