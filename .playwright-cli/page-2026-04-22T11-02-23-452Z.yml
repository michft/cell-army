      - 'heading "Strands Agents on Lambda: Observability With Powertools & X-Ray" [level=3] [ref=e2374]'
      - paragraph [ref=e2375]: Dev chat
      - paragraph [ref=e2376]: When a Strands Agent fails across five Lambda log streams with no correlation, debugging takes 20 minutes minimum. This session demonstrates a structured observability layer that reduces diagnosis to under two minutes. You'll learn how Lambda Powertools Tracer wraps Strands tool invocations as X-Ray subsegments, how Powertools Logger injects AgentCore session correlation IDs across invocations, and how Powertools Metrics surfaces tool retry frequency as CloudWatch alarms — before timeouts occur. The session covers three production failure classes — tool timeout, reasoning loop, and retry storm — and delivers a reusable CDK construct providing full instrumentation for any Strands Agent Lambda deployment. - Darshit Pandya, Senior Principal Engineer, Serko Ltd.
