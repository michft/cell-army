      - paragraph [ref=e1425]: Modern AWS environments generate more alerts than teams can realistically investigate. This session demonstrates a proof-of-concept that transforms Slack alerts into automated investigation workflows using AI.Learn how to trigger parallel queries across CloudWatch, Amazon EKS, Prometheus, and deployment history when an alert fires — returning correlated summaries with probable causes and dashboard links directly in Slack.You'll leave understanding practical integration patterns for AI-assisted triage, telemetry hygiene requirements, and guardrails for safely introducing AI into production incident response. Discover how AI augments — rather than replaces — your existing observability stack, meaningfully reducing time-to-insight during incidents. - Dmytro Sirant, Owner, Perun Engineering
