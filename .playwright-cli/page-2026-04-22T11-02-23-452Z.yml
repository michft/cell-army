      - 'heading "Agents in the enterprise: Best practices with Amazon Bedrock AgentCore" [level=3] [ref=e271]'
      - paragraph [ref=e272]: Breakout session
      - paragraph [ref=e273]: As organizations scale AI agent development, robust enterprise architecture patterns become essential. In this advanced session, we'll explore how Amazon Bedrock AgentCore enables teams to build modular systems using their preferred frameworks while sharing tools through MCP gateways. Learn about A2A collaboration, shared memory, identity-based access controls, and integrated observability. Discover practical strategies for secure runtime deployment, standardized tool integration, evaluation frameworks, and end-to-end monitoring. Leave with actionable insights to build secure, scalable agent infrastructures that balance centralized governance with team autonomy. - Josh Samuels, Senior AI/ML Specialist Solutions Architect, AWS
