      - 'heading "40,000 Users, Zero Downtime: NSW Courts'' Cloud Migration Journey" [level=3] [ref=e75]'
      - paragraph [ref=e76]: Breakout session
      - paragraph [ref=e77]: "The Department of Communities and Justice (DCJ) faced a critical challenge: their JusticeLink platform—serving 40,000+ users across NSW courts—ran on end-of-life infrastructure including Windows Server 2008/2012, Oracle RAC, and IBM WebSphere. DCJ partnered with AWS Professional Services to modernize their technology stack, migrating to Linux-based containers (JBoss EAP on Amazon ECS), Amazon RDS with Multi-AZ high availability, and Infrastructure as Code with CI/CD pipelines. The project achieved seamless cutover across 14 courts, met NSW Government's \"Cloud Right\" goals, and reduced Total Cost of Ownership. Learn strategies for replatforming mission-critical government systems with zero downtime, vendor certification approaches, and Infrastructure as Code patterns. Target Audience: Government IT leaders, enterprise architects, platform engineers, and technical decision-makers modernizing legacy systems."
