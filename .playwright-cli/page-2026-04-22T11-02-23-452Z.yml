      - heading "CI/CD Guardrails for Agentic Coding Workflows" [level=3] [ref=e597]
      - paragraph [ref=e598]: Dev chat
      - paragraph [ref=e599]: AI coding agents introduce failure modes traditional CI/CD pipelines weren't built to catch — deleted tests, weakened type constraints, silent cross-service regressions. This session examines practical pipeline-level guardrails for agentic workflows running on ECS Fargate and distributed CI environments. You'll learn which failure patterns agents introduce that humans rarely do, which automated checks reliably catch them, and how to structure pipelines that apply appropriate scrutiny to agent-generated code without blocking developer velocity. Leave with concrete, implementable patterns covering test integrity enforcement, type safety validation, and cross-service regression detection — applicable whether you're managing one agent or coordinating many across multiple repositories. - Matthew Merriel, Principal Consultant, Mantel Group
