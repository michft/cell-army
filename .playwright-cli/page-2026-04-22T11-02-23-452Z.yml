      - heading "Data Observability Without the Pain - Lessons from a Production System" [level=3] [ref=e633]
      - paragraph [ref=e634]: Dev chat
      - paragraph [ref=e635]: Modern IoT platforms are inherently data platforms. Events flow through APIs, queues, AWS Lambda Serverless functions, storage systems, and device networks before becoming meaningful data. When something goes wrong, tracing a single event across these distributed components quickly becomes painful—and the question shifts from _“what happened?”_ to _“where do I even start looking?” I’ll walk through three practical observability patterns drawn from building and operating a production, event-driven IoT healthcare platform on AWS that processes tens of thousands of device events daily. Using OpenTelemetry, AWS X-Ray and Honeycomb, we’ll explore techniques for gaining visibility into asynchronous event pipelines, correlating activity across services, and tracing events as they move through distributed systems. You’ll leave with three concrete patterns you can apply immediately to your own event-driven data systems. - Matthew Gillard, CTO and Co Founder CuidadoConnect
