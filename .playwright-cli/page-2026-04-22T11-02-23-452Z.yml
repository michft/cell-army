      - 'heading "Agentic AI Meets responsible AI: Strategy and best practices" [level=3] [ref=e255]'
      - paragraph [ref=e256]: Breakout session
      - paragraph [ref=e257]: AI agents offer powerful capabilities and require thoughtful design to help manage risks. This session explores responsible agentic AI implementation with appropriate controls and governance. Understand some of the scientific frontiers that inform design considerations, including the language of AI agents, context management, agent interactions, and common sense reasoning. Learn approaches for human oversight, risk mitigation, evaluation methods, and control mechanisms to help align agent behaviors with organizational goals, and help make agentic AI both effective and trustworthy. - Linta Thayyil Mathew, Principal Solutions Architect, AWS
