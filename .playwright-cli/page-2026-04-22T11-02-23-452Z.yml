      - paragraph [ref=e1360]: Dev chat
      - paragraph [ref=e1361]: You can’t turn your head sideways without seeing a slew of articles, blogs, or videos about AI, and most of them focus on developer tooling and writing code. But AI isn’t just for developers. It’s an incredibly powerful tool for operations folks, too.In this lightning talk, I’ll share how I use Kiro CLI and the Kiro console with AWS Model Context Protocol (MCP) integrations for day-to-day cloud operations. From information gathering and log analysis to reporting and IAM policy interpretation, these tools help reduce cognitive load and speed up your output when working with AWS environments.I’ll also discuss how I used Kiro’s spec-driven development approach to build a Python-based reporting tool, despite not being a software developer.This session is designed to make AI tooling feel approachable and practical for anyone working in AWS — not just developers. - Jason Wood, Lead Consultant - Cloud, Versent
