      - heading "Zero-Downtime Migration from Sydney to Auckland (ap-southeast-6)" [level=3] [ref=e2504]
      - paragraph [ref=e2505]: Dev chat
      - paragraph [ref=e2506]: "With AWS ap-southeast-6 (Auckland) now open, New Zealand organizations can repatriate workloads from Sydney. This advanced session provides practical migration strategies minimizing downtime and eliminating data loss across every layer of your stack. You'll learn region-to-region migration patterns for: *Storage*: S3 replication, EBS snapshots, EFS cross-region transfers *Databases*: RDS read replicas, DynamoDB global tables, self-managed EC2 database replication *Applications*: Lambda, ECS/EKS workload migration, EC2 AMI copying Walk away with a prioritized migration playbook, realistic RTO/RPO targets, and battle-tested sequencing strategies for large-scale data transfers without extended application outages. - Terence White, Practice Lead, ClearPoint"
