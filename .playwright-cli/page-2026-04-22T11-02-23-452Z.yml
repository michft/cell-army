      - heading "Build Intelligent Memory Systems for AI Agents" [level=3] [ref=e580]
      - paragraph [ref=e581]: Dev chat
      - paragraph [ref=e582]: Explore how to build production-grade AI agents with persistent, context-aware memory using Amazon Bedrock AgentCore. This expert session covers architectural patterns for implementing four memory types—episodic, semantic, preference, and summary—enabling agents that recall past interactions, recognize cross-session patterns, and maintain conversation context. You'll examine real implementation techniques for long-term memory management, workflow orchestration, and retrieval strategies using Amazon Bedrock. Leave with practical skills to design intelligent agents that deliver faster, more accurate responses in high-stakes applications. Ideal for architects and engineers ready to move beyond stateless AI toward genuinely intelligent, memory-enabled systems. - Rahul Grover, Senior Director, Publicis Sapient
