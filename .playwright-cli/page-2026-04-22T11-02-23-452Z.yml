      - paragraph [ref=e1217]: Breakout session
      - paragraph [ref=e1218]: "Discover how Flybuys achieved rapid contact centre transformation through early Amazon Connect adoption using AI-powered capabilities and a disciplined Test, Learn, Iterate approach. Starting with a focused pilot, they deployed AI-driven features like intelligent routing, real-time sentiment analysis, and automated quality assurance. They progressed through Launch, Activate, and Consume phases—capturing baseline metrics, scaling through peer-led training, and continuously refining AI performance based on weekly feedback loops. The results: reduced AHT, improved CSAT, 100% AI-powered QA coverage, and measurable ROI. This demonstrates that early AI adoption delivers calculated, data-driven transformation. - Elias Sayigh, Sr. WW Specialist SA, Connect, AWS"
