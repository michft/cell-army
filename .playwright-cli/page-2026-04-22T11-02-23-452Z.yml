      - 'heading "AI Outputs: Amazon Bedrock Structured Output in Production" [level=3] [ref=e334]'
      - paragraph [ref=e335]: Dev chat
      - paragraph [ref=e336]: Parsing LLM responses as JSON works—until truncation, missing fields, or malformed output breaks your pipeline. This session examines Amazon Bedrock Structured Output, which enforces schema compliance at the model level rather than relying on prompt instructions. You'll learn how to define response contracts using JSON Schema, understand where native structured output differs from prompt-based approaches, and see practical patterns for integrating reliable model responses into production systems. Attendees will leave with concrete techniques for eliminating output validation failures, designing more resilient AI workflows, and understanding the architectural implications of treating model responses as typed, validated data rather than freeform text. - Alan Blockley, Global Head of Ecosystem Enablement, Thoughtworks
