      - heading "AI Monetization and Pricing Strategies" [level=3] [ref=e317]
      - paragraph [ref=e318]: Breakout session
      - paragraph [ref=e319]: Software companies developing AI solutions face unique monetization challenges. AI compute costs run 3-5x higher than standard applications, per-user pricing often yields negative margins, and profit margins typically fall 10-30 points below traditional SaaS. This session introduces a proven framework to help you navigate AI pricing complexities. Learn how to identify value capture attributes, select appropriate pricing models, and build sustainable monetization strategies. We'll cover when to begin pricing considerations, how to apply an AI monetization framework to your solutions, and how to develop an approach tailored to your company's position. Whether defining your initial AI pricing strategy or validating your current approach, gain actionable insights to maximize the value of your AI investments. - Anselmo Barrero, Integrated GTM Lead, AWS - Ainslie Williams, Sr AI Specialist, AWS
