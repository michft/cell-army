      - paragraph [ref=e526]: Breakout session
      - paragraph [ref=e527]: "Commonwealth Bank migrated the world's largest SAP core banking deployment to AWS in 18 months: the system behind 40% of Australia's payments, 15 million customers, running 24×7. This isn't a lift-and-shift story, it's a reinvention of how the bank runs critical systems - from architecture and resilience engineering to replacing siloed operational teams with full-stack automation, and the cultural shift this required. Join us to hear how CBA's critical financial infrastructure was modernised with AWS, and what this unlocks for their AI-enabled future. If you're building foundations for regulated, mission-critical workloads, this is the session you don't want to miss. - Eneko Bilbao, Head of Specialist Solutions Architects, AWS - Simon Davies, General Manager, Core Banking Technology, Commonwealth Bank of Australia"
