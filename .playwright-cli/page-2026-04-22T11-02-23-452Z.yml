      - 'heading "Prompt Engineering to Learning Systems: Woodside''s Agentic Ecosystem" [level=3] [ref=e1130]'
      - paragraph [ref=e1131]: Breakout session
      - paragraph [ref=e1132]: Woodside’s Agentic Maintenance Framework connects frontline execution to long‑horizon strategy, turning each job into fuel for continuous improvement. The approach uses governed evidence and multi‑agent AI to assemble the right context at the decision point—improving request quality, planning accuracy, and execution readiness—while capturing plan‑vs‑actual signals that strengthen backlog quality, scheduling confidence, and long‑term maintenance strategies. The result is a closed loop where execution improves strategy, and strategy improves execution, all within existing governance and systems of record. In this talk, we’ll share practical lessons from designing the tactical layer (Maint Assist) and the strategic layer (Maint Intel), show how evidence is created once and reused across the lifecycle, and outline a maturity path from prompts to agentic orchestration—focused on safety, reliability, and efficiency. - Varun Saxena, Sr. Delivery Consultant, AWS - Sankar Thiagarajan, Principal AI Product Manager, Woodside
