      - 'heading "From Zero to 270 AI Agents: how Lendi built Guardian" [level=3] [ref=e790]'
      - paragraph [ref=e791]: Breakout session
      - paragraph [ref=e792]: "When Lendi Group launched Project Aurora on AWS, they bet big on a single super-agent with 270 tools. It flopped—technically impressive but commercially useless. The agent couldn't sell. The breakthrough came from treating AI like a workforce: specialist agents with clear roles, sales logic embedded in the funnel, and relentless measurement. Engagement tripled. This talk shares the hard lessons from Lendi's 16-week sprint: why capability isn't outcome, why your best prompt engineer might be a 23-year-old closer, and how to architect agentic systems that actually convert. - Igor Londero Gentil, FSI Solutions Arch, Field-AGS-ANZ-ENT-CS, AWS - Devesh Maheshwari, Chief Technology Officer, Lendi Group, Lendi Group"
