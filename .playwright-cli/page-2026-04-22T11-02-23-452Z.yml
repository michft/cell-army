      - paragraph [ref=e181]: Breakout session
      - paragraph [ref=e182]: "Most organisations use AI to help developers code faster, but few have figured out what needs to change when building is no longer the bottleneck. This session introduces AI-DLC, the next evolution in how teams deliver software: a methodology that compresses specification timelines from months to weeks, and fundamentally changes how product teams operate. SEEK's Principal Product Manager shares how AI-DLC reshaped their people, process, and technology, and how they're now scaling across multiple product teams. You'll hear what's working, what's hard, what they're still figuring out and what it means for how your organisation delivers. - Sophie Rabani, Senior Customer Solutions Manager, AWS - Arden Packeer, Principal Solutions Architect, DevAx, AWS - Josh Centner, Principal Product Manager, SEEK"
