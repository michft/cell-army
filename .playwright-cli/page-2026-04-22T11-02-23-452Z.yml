      - heading "Managing AI Agents with Confidence and Control using Kasada & AWS" [level=3] [ref=e1004]
      - paragraph [ref=e1005]: Lightning talk
      - paragraph [ref=e1006]: "AI agents are powerful but risky—they can access sensitive data, trigger workflows, and make autonomous decisions. Kasada and AWS are helping enterprises adopt agents with confidence through comprehensive AI agent trust management that protects legitimate AI agents while detecting and blocking malicious automated visits. Kasada's platform, integrated with AWS services, enables organizations to distinguish trusted agent traffic from sophisticated bot threats, monitor for anomalous behavior, and maintain agent integrity against evolving AI-powered attacks. Join Kasada and AWS experts to explore a practical framework for managing agent trust: how AI and agentic traffic are being abused today, where risks appear across discovery and checkout, how teams decide when to allow or block agents, what new protocols like Web Bot Auth do and where they fall short, and what Kasada has built for agent traffic visibility—all while maintaining seamless customer experience. - Sam Crowther Founder & CEO, Kasada"
