      - 'heading "Power of Possibility: Leading Through Innovation and Connection" [level=3] [ref=e1112]'
      - paragraph [ref=e1113]: Breakout session
      - paragraph [ref=e1114]: As AI reshapes every industry, professionals across all roles and backgrounds are navigating an unprecedented pace of change—bringing new opportunities but also rising burnout, blurred boundaries, and pressure to continuously adapt. This moment of disruption presents a powerful opportunity to not only deliver innovation but to redesign how we lead, build culture, and sustain meaningful careers in more equitable ways. Join accomplished AWS leaders and peers for this immersive session that combines strategic leadership frameworks, emotional intelligence, and interactive roundtable discussion to accelerate your impact in tech. Together, we will explore practical strategies for claiming visible technical leadership, activating professional networks, setting sustainable boundaries in hybrid work, and championing responsible AI adoption without amplifying existing inequalities. Participants will share lived experiences, tactics that worked and lessons learned, and build meaningful connections through guided speed networking in a collaborative, supportive environment. This session empowers professionals from all backgrounds, with particular focus on amplifying diverse voices and fostering inclusive innovation. Leave with actionable strategies to strengthen your leadership presence, leverage emotional intelligence as a career accelerator, build psychologically safe and inclusive team environments, and navigate the challenges shaping your future in tech. - Ambika Sinha Account Manager AWS - Jyothi Madanlal, Solutions Architect, AWS - Sarah Bassett, Director of Software, AWS
