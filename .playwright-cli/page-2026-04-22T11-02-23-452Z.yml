      - paragraph [ref=e563]: Many teams move fast with agentic AI prototypes that impress in demos but stall in production—blocked by gaps in reliability, accuracy, and safety. In this session, AWS agentic AI technical leaders will help builders rethink how to build and scale production-grade, trustworthy agentic AI. Learn proven patterns to build and deploy agents that earn trust in the real world. See AWS agentic AI platform Amazon Bedrock AgentCore in action. Discover how AWS customers move fast from sparks of experiment to scaled AI-driven innovation with trust at the core, transforming industries. - Nieves Garcia, Head of Generative AI Strategy - APJC - Generative AI Innovation Center, AWS - Rossana Bianchi, Head of Generative AI Strategy - ANZ - Generative AI Innovation Center, AWS - Lily Martin, Deep Learning Architect - ANZ - Generative AI Innovation Center, AWS
