      - heading "Active-Active Global Architecture with CloudFront and Route 53" [level=3] [ref=e146]
      - paragraph [ref=e147]: Dev chat
      - paragraph [ref=e148]: "In this lightning talk, we'll walk through a real-world architectural pattern used in production: combining AWS CloudFront with Route 53 latency-based routing to make your ECS-backed services truly global. Starting with the problem of slow response times for APAC users, we'll build up a practical active-active architecture step by step. You'll see how CloudFront sits in front of your regional ALBs, how WAF is woven into the design from the start rather than bolted on later, and why getting your domain configuration right — distinguishing between your ALB origin domain and your public-facing CloudFront alternate domain — is critical to making this pattern work correctly. - Lovee Jain, Senior Software Engineer, Prezzee"
