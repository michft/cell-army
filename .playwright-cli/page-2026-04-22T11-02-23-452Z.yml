      - heading "Transforming software license efficiency - Human-centered AI on AWS" [level=3] [ref=e2459]
      - paragraph [ref=e2460]: Breakout session
      - paragraph [ref=e2461]: As Worley's global software portfolio expanded, manual license governance couldn't keep pace with scale and complexity. Built on AWS-native services, Worley created an agentic AI capability that monitors usage across regions and engages users through Microsoft Teams to drive optimal license decisions. Instead of blunt removals, the agent fosters positive, context-aware interactions helping users choose the right license for their work. By unifying siloed data on AWS and applying intelligent automation, Worley ensures every user has the right license at the right time, enabling software efficiency at scale, maximizing value, eliminating waste, and achieving sustainable cost reduction. - Roshan Thomas, Principal Solutions Architect, AWS
