      - paragraph [ref=e826]: "MedAdvisor, Australia's leading medication management platform connecting over 90% of community pharmacies, faced a critical challenge: pharmacists were losing hours daily to manual documentation, diverting time from patient care. To solve this, MedAdvisor built an AI-powered Scribe using Amazon Nova on Amazon Bedrock. The tool listens to pharmacy consultations in real time, transcribes conversations, and automatically generates structured clinical notes. Through iterative prompt engineering, output quality improved from 3.5 to nearly 4.5 out of 5, surpassing market alternatives. Now in beta across Australia, the solution went from concept to production-grade clinical documentation in under six months. - Joe Antony, Head of Product, MedAdvisor - Dani Li, Head of Partnerships, Medadvisor"
