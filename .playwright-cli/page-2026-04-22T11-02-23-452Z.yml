      - paragraph [ref=e1344]: Dev chat
      - paragraph [ref=e1345]: Cloud infrastructure changes carry hidden risks that manual reviews often miss. This session demonstrates how to build a pre-deployment blast-radius reviewer using Amazon Bedrock that analyzes infrastructure-as-code diffs, IAM policy changes, and deployment metadata to produce structured risk assessments in seconds. Attendees will learn how to design grounded AI workflows that identify affected services, security gaps, cost implications, and rollback considerations, and how to apply Bedrock guardrails for consistent, safe outputs. The session includes a live demonstration and covers practical patterns for integrating AI-generated assessments into existing engineering approval and governance processes without sacrificing speed or reliability. - Renaldi Gondosubroto, Senior Software Engineer, Commonwealth Bank
