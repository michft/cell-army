      - 'heading "AI at Speed of News: Unlocking Value from Media with Generative AI" [level=3] [ref=e287]'
      - paragraph [ref=e288]: Breakout session
      - paragraph [ref=e289]: For media and communications organizations, the ability to rapidly discover, repurpose, and distribute content across platforms directly impacts revenue and audience engagement. This session examines how Generative AI is transforming content operations through intelligent metadata extraction, semantic search, and automated workflow orchestration. Using a case study from a global media organization managing 13 petabytes of content growing at 3,000 hours daily, we'll explore practical implementations using Amazon OpenSearch for multimodal retrieval, Amazon Neptune for knowledge graphs, and agentic AI for content assembly. Learn how organizations are achieving faster time-to-market, improved content monetization, and enhanced audience experiences through AI-powered content discovery and recommendation systems - Alastair Cousins, Tech Leader - MEGS, AWS - Scott McCue, Sr. Solutions Architect, AWS
